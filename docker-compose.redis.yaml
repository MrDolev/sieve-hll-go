# LOCAL environment: Redis only. Use this when writing/testing code locally
# and running the Go binary directly with `make local-run` (no app container).
services:
  redis:
    image: redis:7-alpine
    container_name: redis-local
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
